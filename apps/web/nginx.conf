server {
  listen 8080;
  # https://localhost:8443 with a self-signed certificate (see docs/platforms.md): Threads and LinkedIn require https redirect URIs.
  listen 8443 ssl;
  ssl_certificate /certs/localhost.crt;
  ssl_certificate_key /certs/localhost.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Largest upload: keep >= MAX_VIDEO_MB in .env.
  client_max_body_size 120m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Docker's embedded DNS + a variable make nginx re-resolve "api" on demand, so the proxy keeps working after the
  # api container is restarted or recreated (a literal proxy_pass would pin the old IP address and answer 502).
  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }

  # Hashed build assets can be cached forever; index.html must always be revalidated.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri /index.html;
  }
}
